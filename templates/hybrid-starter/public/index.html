<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Hybrid Starter Web & Worker Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 600px; margin: 0 auto; border: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 24px; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; background: #059669; color: white; }
    p { color: #94a3b8; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>Hybrid Web + Backend Starter</h1>
      <span class="badge">Running</span>
    </div>
    <p>当前项目采用双引擎异构环境架构：</p>
    <ul>
      <li><strong>Web & 数据库引擎</strong>：由 DDEV 容器隔离托管，提供 PHP/Nginx/MariaDB 栈与 HTTPS 路由。</li>
      <li><strong>后台脚本引擎</strong>：由 DevContainer 沙箱提供隔离运行环境，执行批处理与分析任务。</li>
    </ul>
    <p>状态自检端点：<a href="/health" style="color:#38bdf8;">/health</a> (HTTP 200 OK)</p>
  </div>
</body>
</html>
