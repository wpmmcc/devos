name: CI & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Workspace Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup DevContainer CLI
        run: npm install -g @devcontainers/cli

      - name: Add Windows npm bin to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $npmPrefix = npm config get prefix
          "$npmPrefix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup DDEV (Ubuntu)
        if: runner.os == 'Linux'
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Setup DDEV (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL "https://github.com/ddev/ddev/releases/latest/download/ddev_macos-arm64.tar.gz" | sudo tar -xz -C /usr/local/bin ddev
          sudo chmod +x /usr/local/bin/ddev

      - name: Setup DDEV (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tools\ddev
          Invoke-WebRequest -Uri "https://github.com/ddev/ddev/releases/latest/download/ddev_windows-amd64.zip" -OutFile C:\tools\ddev\ddev.zip
          Expand-Archive -Path C:\tools\ddev\ddev.zip -DestinationPath C:\tools\ddev -Force
          "C:\tools\ddev" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Framework Engines Execution
        shell: bash
        run: |
          echo "=== DDEV Framework Version ==="
          ddev --version || ddev version
          echo "=== DevContainer Framework Version ==="
          devcontainer --version

      - name: Run Cargo Check
        run: cargo check --workspace

      - name: Run Cargo Tests
        run: cargo test --workspace

      - name: Run CLI Headless Smoke Test
        run: cargo run -p devos-cli -- --smoke-test

      - name: Run CLI Preflight Doctor Check
        run: cargo run -p devos-cli -- doctor --json

      - name: Run Comprehensive E2E Simulation Test
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/test_e2e_comprehensive.py

  test-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Frontend Build
        run: pnpm build

  check-formatting:
    name: Monorepo Formatting & Standards Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Git Attributes (LF enforcement)
        run: |
          test -f .gitattributes
          grep "text=auto eol=lf" .gitattributes
