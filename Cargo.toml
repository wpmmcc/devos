[workspace]
resolver = "2"
members = [
    "crates/devos-schema",
    "crates/devos-core",
    "crates/devos-env",
    "crates/devos-cli",
    "crates/devos-mcp",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DevOS Team"]
license = "MIT"
repository = "https://github.com/devos-ai/devos"

[workspace.dependencies]
# Internal crates
devos-schema = { path = "crates/devos-schema" }
devos-core = { path = "crates/devos-core" }
devos-env = { path = "crates/devos-env" }

# Serialization & schema
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
ts-rs = { version = "10.1", features = ["serde-compat", "chrono-impl", "uuid-impl"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CLI & Tracing
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database & File System
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.12"
walkdir = "2.5"
notify = "6.1"
regex = "1.10"
dirs = "5.0"
toml_edit = "0.22"
